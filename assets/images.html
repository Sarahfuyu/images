<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bakery Images</title>

    <style>
        body {
            background-color: #D0D1E6;
            font-family: cursive;
            color: #D7B56B;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            font-style: italic;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

       
        .small {
            width: 180px;
            height: auto;
            border-radius: 10px;
        }

       
        .medium {
            width: 300px;
            height: auto;
            border-radius: 10px;
        }

       
        .large {
            width: 450px;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>MY BAKERY IMAGES</h1>

    <div class="gallery">
        <img src="assets/apples.jpeg" class="small" alt="Apples">
        <img src="assets/muffins.jpeg" class="medium" alt="Muffins">
        <img src="assets/banana.jpeg" class="large" alt="Banana Bread">
        <img src="assets/bread.jpeg" class="small" alt="Bread">
        <img src="assets/cookies.jpeg" class="medium" alt="Cookies">
        <img src="assets/cornbread.jpeg" class="large" alt="Cornbread">
        <img src="assets/gfvg.jpeg" class="medium" alt="Bakery Item">
    </div>

</body>
</html>
